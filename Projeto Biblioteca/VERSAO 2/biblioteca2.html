<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/2232/2232688.png" type="image/png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
  <title>Biblioteca</title>
<body>
<div class="container">
    <h1>BIBLIOTECA SENAI - EDUCAÇAO PARA A VIDA!</h1>
  <div class="menu">
        <button onclick="mostrarSecao('cadastro')">
            <i class="fas fa-book-medical icon"></i>Cadastrar Livro
          </button>
          <button onclick="mostrarSecao('consulta')">
            <i class="fas fa-search icon"></i>Consultar Livros
          </button>
          <button onclick="mostrarSecao('alterar')">
            <i class="fas fa-edit icon"></i>Alterar Livro
          </button>
           <button onclick="mostrarSecao('emprestimo')">
            <i class="fas fa-edit icon"></i> Emprestimo de Livro
          </button>
    </div>


<!-- Seçao de cadastro -->
    <div id="cadastro" class="hidden">
    <h2> Cadastro Livro </h2>
    <div class=" form group">
        <label for="titulo">Titulo:</label>
        <input type="text" id="titulo" placeholder="Digite o titulo do livro">
    </div>
    <div class=" form group">
        <label for="autor">Autor:</label>
        <input type="text" id="autor" placeholder="Digite o autor do livro">
    </div>
    <div class="form group">
        <label for="ano">Ano:</label>
        <input type="number" id="ano" placeholder="Digite o ano de publicaçao">
 </div>
<button onclick="adicionarLivro()">Adicionar Livro</button>
</div>


<!-- Seçao de consulta -->
 <div id="consulta" class="hidden">
 <h2>Consultar Livro</h2>
 <input type="text" id="busca" placeholder="Buscar por Titulo" oninput="buscarLivro()">
 <table>
    <thead>
        <tr>
            <th>Titulo</th>
            <th>Autor</th>
            <th>Ano</th>
        </tr>
    </thead>
    <tbody id="lista-livro">
        <!-- Livros serao exibidos aqui -->
    </tbody>
 </table>
</div>

<!-- seçao de alteraçao -->
 <div id="alterar" class="hidden">
    <h2>alterar Livro</h2>  <div id="form-alterar" class="hidden">
    <input type="text" id="buscar-alterar" placeholder="Buscar por titulo" oninput="buscarLivroParaAlterar()"/>
  
    <div class=" form group">
        <label for="novo-titulo">Novo Titulo:</label>
        <input type="text" id="novo-titulo" placeholder="Digite o novo titulo ">
    </div>
    <div class=" form group">
        <label for="novo-autor">Novo Autor:</label>
        <input type="text" id="novo-autor" placeholder="Digite o novo autor ">
    </div>
    <div class="form group">
        <label for="novo-ano">Ano:</label>
        <input type="number" id="novo-ano" placeholder="Digite o novo ano ">
 </div>
 <button onclick="alterarLivro()">  Salvar alteraçoes</button>
 </div>

</div>
    <div id="emprestimo" class="hidden">
    <h2> Emprestimo de Livro </h2>
    <div class="form group">
        <label for="titulo1">Titulo:</label>
        <input type="text" id="titulo1" placeholder="Digite o titulo do livro">
    </div>
    <button onclick="emprestimo()">Emprestar Livro</button>
 </div>
</div>
    <script src="biblioteca2.js"></script>
</body>
</html>
