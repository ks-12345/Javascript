<!DOCTYPE html>
<html lang="en">
<head>

</head>

                    preçoproduto = 1.200;

                    break;
                case "PROD002":
                     nomeproduto = "Celular";
                    preçoproduto = 2.500;

                    break;
                case "PROD003":
                    nomeproduto = "Tablet";
                    preçoproduto = 1.500;
                    break;
                default:
                    produto = "Código de produto inválido!";
            }
            document.getElementById("resultadoProduto").innerHTML = `O produto é: <strong>${nomeproduto}</strong> e <strong>${preçoproduto.toFixed(3)}</strong>`;
        }
        </script>
</body>
</html>
