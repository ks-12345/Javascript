<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Menu de Opções </title>
</head>
<body>
    Opçoes (1-3): <input type="number" id="opcaoEscolhidas" min="1" max="3" value="2"><br><br>
    <button onclick="exibirOpcoes()">Exibir Opção</button>
    <div id="resultadoOpcoes"></div>
    <script>
        function executarOpçoes() {
            let opçoes = parseInt(document.getElementById("opcaoEscolhidas").value);
            let mensagem;
            switch (opçao) {
                case 1:
                    mensagem = "Imprimindo...";
                    break;
                case 2:
                    mensagem = "Salvando...";
                    break;
                case 3:
                    mensagem = "Saindo...";
                    break;
                default:
                    mensagem = "Opções invalida.";
                
            }
            document.getElementById("resultadoOpçoes").innerHTML = `Ação: <strong>${mensagem}</strong>`;
        }
    </script>
</body>
</html>
